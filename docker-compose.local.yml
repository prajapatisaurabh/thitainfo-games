# ===========================================
# LOCAL DEVELOPMENT DOCKER COMPOSE
# ===========================================
# Usage: docker-compose -f docker-compose.local.yml up --build
# MongoDB is hosted on MongoDB Atlas — MONGO_URL is read from your .env file
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: thitainfo_games_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    volumes:
      # Mount source code for hot reload (exclude node_modules and build cache)
      - .:/app
      - /app/node_modules
      - /app/.next
