# ===========================================
# PRODUCTION DOCKER COMPOSE
# ===========================================
# Usage: docker-compose up --build
# MongoDB is hosted on MongoDB Atlas — set MONGO_URL in your .env
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thitainfo_games_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME:-typer}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
